<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catéteres en Equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eaf1f3;--card:#ffffff;--ink:#14262b;--mut:#51666c;--line:#cddbdf;--accent:#0c6a73;--aink:#ffffff;
--ok:#1b7f47;--okbg:#e3f4ea;--bad:#b8352a;--badbg:#fbe9e6;--warn:#8a5d0c;--warnbg:#fcf1d6;
--font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--disp:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0d1a1e;--card:#15262b;--ink:#e6eff1;--mut:#9ab0b5;--line:#2a4047;--accent:#4fc0c6;--aink:#05191b;
--ok:#4cc27d;--okbg:#10301f;--bad:#f08072;--badbg:#3a1714;--warn:#e3b457;--warnbg:#33290f}}
:root[data-theme="dark"]{
--bg:#0d1a1e;--card:#15262b;--ink:#e6eff1;--mut:#9ab0b5;--line:#2a4047;--accent:#4fc0c6;--aink:#05191b;
--ok:#4cc27d;--okbg:#10301f;--bad:#f08072;--badbg:#3a1714;--warn:#e3b457;--warnbg:#33290f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font)}
#app{max-width:560px;margin:0 auto;padding:12px 14px 40px}
h1,h2,h3{font-family:var(--disp);line-height:1.15;margin:.2em 0 .4em;letter-spacing:-.01em}
h1{font-size:34px;font-weight:800}h2{font-size:25px;font-weight:800}h3{font-size:19px;font-weight:700}
p{margin:.5em 0}
.btn{display:block;width:100%;min-height:58px;padding:14px 16px;margin:10px 0;border:0;border-radius:16px;background:var(--accent);color:var(--aink);font:700 18px/1.2 var(--font);cursor:pointer;text-align:center}
.btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.sm{min-height:48px;font-size:16px;padding:10px 12px}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:scale(.99)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.hud b{font-size:17px}
.hearts{color:var(--bad);letter-spacing:2px;font-size:19px;white-space:nowrap}.hearts i{color:var(--line);font-style:normal}
.tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:19px}.tm.low{color:var(--bad)}
.imgbox{background:#0a1316;border-radius:14px;padding:6px;margin:10px 0}
.imgbox svg{display:block;width:100%;height:auto;max-height:50vh;margin:0 auto}
.cap{font-size:14px;color:var(--mut);margin:2px 2px 8px}
.tag{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.opt{display:block;width:100%;text-align:left;min-height:58px;padding:13px 14px;margin:8px 0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font:inherit;cursor:pointer}
.opt.mine{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--okbg);box-shadow:inset 0 0 0 2px var(--ok);font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--badbg);box-shadow:inset 0 0 0 2px var(--bad)}
.opt.ok::after{content:' ✓ Correcta';color:var(--ok)}
.opt.bad::after{content:' ✗ Incorrecta';color:var(--bad);font-weight:700}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
.opt[hidden]{display:none}
.fb{border-radius:14px;padding:12px 14px;margin:10px 0;border:2px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.bad{background:var(--badbg);border-color:var(--bad)}.fb.warn{background:var(--warnbg);border-color:var(--warn)}
.fb strong{display:block;margin-bottom:2px}
.ver{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:0 4px;font-size:.86em;font-weight:700}
.src{font-size:14px;color:var(--mut);margin-top:4px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t td:first-child{color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{min-height:48px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--aink);border-color:var(--accent)}
.muted{color:var(--mut);font-size:15px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.roles{font-size:15px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.roles b{color:var(--accent)}
.qn{font-size:15px;color:var(--mut)}
.obs{border-left:5px solid var(--warn)}
.obs ul{margin:6px 0 10px;padding-left:20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{min-height:64px;padding:8px 10px;border-radius:14px;border:2px dashed var(--accent);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.cbtn b{display:block;color:var(--accent)}
.cbtn small{color:var(--mut);font-size:13px;line-height:1.2;display:block}
.cbtn:disabled{opacity:.4;border-style:solid}
.big{font-family:var(--disp);font-size:44px;font-weight:800;line-height:1}
.badge{display:flex;gap:10px;align-items:center;padding:8px 0}
.badge svg{flex:none}
.cert{border:3px double var(--accent);border-radius:18px;padding:18px;text-align:center;background:var(--card)}
input[type=text]{width:100%;min-height:56px;font:inherit;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
details.rv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
details.rv summary{font-weight:700;cursor:pointer;min-height:40px}
.rvi{border-top:1px solid var(--line);padding:8px 0;font-size:15px}
.rvi.crit{border-left:4px solid var(--bad);padding-left:8px}
.rok{color:var(--ok);font-weight:700}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- Datos ---------- */
const Q=(q,o,c,w,s)=>({q,o,c,w,s});
const LV=[
 {n:'Reconocer',t:90,b:'Mirada atenta',f:'Tipos de catéter, materiales e indicaciones.'},
 {n:'Insertar y verificar',t:180,b:'Punta en su lugar',f:'Longitud de inserción y lectura de la radiografía: punta bien, alta o baja.'},
 {n:'Mantener',t:180,b:'Asepsia sostenida',f:'Bundle, curación, equipos e infusiones, con errores escondidos.'},
 {n:'Anticipar',t:240,b:'Tendencia a tiempo',f:'Tres tomas seriadas para detectar una complicación incipiente.'},
 {n:'Crisis en equipo',t:120,b:'Equipo en crisis',f:'Un PICC que evoluciona a taponamiento, en eventos encadenados.'}
];
const CARDS=[
 {k:'segunda',n:'Segunda mirada',d:'Marca referencias en la imagen y suma 30 s'},
 {k:'pausa',n:'Pausa de equipo',d:'Detiene el reloj hasta 60 s'},
 {k:'consulta',n:'Consulta al especialista',d:'Descarta dos opciones incorrectas'},
 {k:'escudo',n:'Escudo',d:'Absorbe el próximo error crítico'}
];
const QL=['Identificar, 10 puntos','Interpretar, 20 puntos','Intervención prioritaria, 30 puntos'];
const B5='Prematuro de 27 semanas, 920 g, día 9. PICC de 1,9 Fr por la basílica derecha desde el día 3, con nutrición parenteral y lípidos. Punta en la cava superior (T5) al colocarlo. Longitud externa documentada: 5,0 cm.';
/* La opción correcta va siempre primera (índice 0); la app mezcla el orden al mostrarla. */
const CASES=[
/* ---- Nivel 1 ---- */
{id:'1.1',lv:0,t:'¿Qué catéter es?',ctx:'Prematuro de 29 semanas, 1100 g, día 2, intubado, con gases frecuentes.',img:{k:'rx',c:'cau',tip:8,cap:'Radiografía esquemática de frente'},q:[
 Q('¿Qué catéter muestra la imagen?',['Catéter arterial umbilical','Catéter venoso umbilical','PICC de miembro inferior','Catéter femoral'],[],'Baja hacia la pelvis y sube por la aorta a la izquierda de la columna.','SIBEN, INS'),
 Q('¿Para qué se coloca habitualmente en este paciente?',['Presión arterial invasiva y toma de gases','Nutrición parenteral prolongada','Exanguinotransfusión','Drogas vasoactivas'],[],'Es el acceso para monitoreo invasivo y extracciones frecuentes en el recién nacido grave.','SIBEN'),
 Q('Hay que mantenerlo permeable. ¿Qué se infunde?',['Solución de baja carga con heparina a bajo caudal, según protocolo','Nutrición parenteral con dextrosa al 15%','Un bolo de antibiótico cada 8 horas','Nada, se deja con tapón'],[1,2],'No se usa para nutrición ni medicación [VERIFICAR concentración y caudal].','SIBEN, INS')]},
{id:'1.2',lv:0,t:'La solución decide el acceso',ctx:'Prematuro de 27 semanas, 800 g, día 3. Nutrición parenteral con dextrosa al 15% y aminoácidos al 3%, por unas tres semanas.',img:{k:'baby',d:['per','picc','umb'],cap:'Accesos posibles'},q:[
 Q('¿Qué característica de la solución condiciona el acceso?',['Su alta osmolaridad y la dextrosa mayor al 12,5%','El color de la bolsa','El volumen total','La marca del fabricante'],[],'La osmolaridad y el pH definen si una solución puede ir por vía periférica.','INS'),
 Q('¿Por qué no corresponde la vía periférica?',['Daña el endotelio y puede extravasarse con lesión de la piel inmadura','Porque es más cara','Porque no admite volumen','Porque necesita rayos para verificarse'],[],'Las soluciones hiperosmolares irritan la vena y necrosan la piel al extravasarse.','INS, SIBEN'),
 Q('¿Qué acceso corresponde para tres semanas?',['PICC con la punta central verificada antes de usarlo','Vía periférica de 24 G renovada cada día','PICC sin verificar para no demorar','Esperar a que haya mejor vena'],[1,2],'Para tres semanas conviene un acceso central estable, y no se usa hasta confirmar la punta.','INS, SIBEN')]},
{id:'1.3',lv:0,t:'Calibre y lúmenes',ctx:'Prematuro de 25 semanas, 780 g, necesita un PICC.',img:{k:'cal',cap:'Calibres frente a la vena'},q:[
 Q('¿Qué material permite verificar la punta por radiografía?',['Radiopaco, de silicona o poliuretano','Cualquier plástico transparente','Metal','Un catéter con lastre líquido'],[],'El catéter debe ser radiopaco para ver la punta.','INS'),
 Q('¿Por qué se prefiere un solo lumen en este peso?',['El calibre menor ocupa menos la vena y se manipula menos','Porque se ve mejor','Porque admite más velocidad','Porque no necesita apósito'],[],'Menos calibre y menos lúmenes, menos riesgo de trombosis y de infección por manipulación.','INS, CDC'),
 Q('¿Qué se prioriza al elegir el calibre?',['El más fino que cubra la indicación y la vena disponible','El más grueso, para infundir más rápido','El que haya en stock','El de doble lumen, para ahorrar un acceso'],[1],'Se elige el dispositivo de menor calibre y menos lúmenes que resuelva la indicación [VERIFICAR calibre exacto para 780 g].','INS')]},
{id:'1.4',lv:0,t:'Una vía periférica que cambia',ctx:'RN de 34 semanas, 2000 g, con dextrosa al 10% y un antibiótico por 48 horas. En el control horario el sitio está pálido y levemente hinchado.',img:{k:'hand',g:1,cap:'Dorso de la mano con vía de 24 G'},q:[
 Q('¿Qué se observa?',['Una infiltración inicial, de grado 1','Una flebitis de grado 4','Un hematoma por la punción','Un sitio normal'],[],'Piel pálida con edema menor de 2,5 cm y fría es grado 1 en la escala de INS.','INS'),
 Q('¿Por qué importa actuar ya?',['El edema crece si se sigue infundiendo y puede dañar el tejido','Porque la bomba suena','Porque va a mejorar sola','Porque hay que cambiar el apósito'],[],'El líquido sigue entrando al tejido y la lesión progresa, aun sin alarma de la bomba.','INS'),
 Q('¿Qué se hace primero?',['Detener la infusión, no lavar, retirar el catéter y elevar el miembro','Aumentar el caudal para que abra','Aplicar calor intenso','Esperar una hora y volver a mirar'],[1,2,3],'Se detiene, se retira y se valora, porque seguir o esperar agrava la lesión.','INS')]},
{id:'1.5',lv:0,t:'¿Midline, PICC o vía periférica?',ctx:'RN de 33 semanas, 1800 g, con un antibiótico por 10 días y dextrosa al 10%, sin venas periféricas confiables.',img:{k:'baby',d:['per','mid','picc'],cap:'Tres accesos posibles'},q:[
 Q('¿Qué dispositivo es adecuado para este tratamiento?',['Un midline','Un catéter venoso umbilical','Un catéter arterial umbilical','Un PICC con la punta en la aurícula'],[],'Son infusiones compatibles con la vía periférica, durante unos 10 días [VERIFICAR].','INS, SIBEN'),
 Q('¿Dónde termina la punta del midline y qué implica?',['En la vena axilar o proximal del brazo, fuera del tórax: solo admite soluciones compatibles con vía periférica','En la cava superior: admite cualquier solución','En la aurícula derecha','En la vena yugular'],[],'La punta no es central, y eso define lo que se puede infundir.','INS'),
 Q('Al día siguiente se indica nutrición parenteral con dextrosa al 15%. ¿Qué se hace?',['Avisar y pedir un acceso central, como un PICC con la punta verificada','Pasarla por el midline','Pasarla más rápido para que no se acumule','Pasarla por el midline solo de noche'],[1,2],'Una solución hiperosmolar necesita una punta central.','INS')]},
/* ---- Nivel 2 ---- */
{id:'2.1',lv:1,t:'CVU bien ubicado',ctx:'Recién nacido de 1000 g con un CVU de 3,5 Fr recién colocado. Radiografía de control.',img:{k:'rx',c:'cvu',tip:9.7,cap:'Radiografía de control'},rows:[['Peso','1000 g'],['Catéter','CVU 3,5 Fr']],obs:['Gorro: sí','Barbijo: sí','Camisolín estéril: sin tildar','Guantes estériles: sí','Campo amplio: sí'],fault:'Faltó el camisolín estéril: la barrera máxima incluye gorro, barbijo, camisolín y guantes estériles.',q:[
 Q('¿Cuál es la longitud de inserción con (3 × peso + 9) ÷ 2 + 1?',['7 cm','12 cm','5 cm','9,5 cm'],[],'3 × 1 + 9 = 12, la mitad es 6 y se suma 1 [VERIFICAR contra la tabla de la unidad].','Shukla y Ferrara, vía SIBEN'),
 Q('La punta está en T9 a T10, sobre el diafragma. ¿Qué indica?',['Bien ubicada, en la unión de la cava inferior con la aurícula','Dentro de la aurícula derecha','En el sistema porta','En la aorta'],[],'Esa altura corresponde a la zona buscada para el CVU.','SIBEN, INS'),
 Q('¿Qué se hace ahora?',['Fijarlo con puente de cinta, registrar la longitud externa y habilitar su uso','Avanzarlo 1 cm más para asegurar','Retirarlo y colocar otro','Usarlo sin registrar la longitud'],[1],'Se anota la longitud externa para detectar migraciones, y no se avanza un catéter ya colocado.','SIBEN, CDC')]},
{id:'2.2',lv:1,t:'CVU bajo, en el hígado',ctx:'Prematuro de 30 semanas, 1400 g, día 1. La nutrición parenteral ya está conectada.',img:{k:'rx',c:'cvu',liver:true,tip:12,cap:'Radiografía de control'},rows:[['Peso','1400 g'],['Catéter','CVU 3,5 Fr']],obs:['La nutrición parenteral se conectó a las 08:10','La radiografía se leyó a las 08:25'],fault:'La nutrición parenteral se conectó antes de leer la radiografía: no se infunden soluciones hiperosmolares hasta confirmar la punta.',q:[
 Q('¿Dónde está la punta?',['Por debajo del diafragma, proyectada en el hígado','Sobre el diafragma, en la aurícula','En la aorta abdominal','En la cava superior'],[],'La punta está baja y el trayecto se desvía hacia el hígado.','SIBEN'),
 Q('¿Por qué importa?',['Una solución hiperosmolar en el sistema porta puede dañar el hígado','Es solo un problema estético','Porque el catéter se tapa antes','Porque cambia el calibre'],[],'Una punta intrahepática expone a necrosis hepática y trombosis portal.','SIBEN, INS'),
 Q('¿Qué se hace primero?',['Suspender las infusiones hiperosmolares, avisar y reposicionar con técnica estéril retirándolo, o retirarlo, con nueva imagen','Seguir con la nutrición parenteral, que ya está conectada','Avanzarlo 3 cm para llegar a T10','Dejarlo y revisar mañana'],[1,2],'Un catéter mal ubicado no se usa para soluciones hiperosmolares, y no se avanza [VERIFICAR criterio local].','SIBEN')]},
{id:'2.3',lv:1,t:'CAU en zona intermedia',ctx:'Prematuro de 28 semanas, 1200 g, intubado. Se conecta la línea arterial.',img:{k:'rx',c:'cau',tip:11.5,cap:'Radiografía de control'},rows:[['Peso','1200 g'],['Catéter','CAU, posición alta buscada']],obs:['Se conecta la llave de tres vías','En la línea se ve una burbuja junto a la llave'],fault:'Burbuja de aire en la línea arterial: se purga por completo antes de conectar, por el riesgo de embolia aérea.',q:[
 Q('¿Cuál es la longitud para posición alta, con 3 × peso + 9?',['12,6 cm','8,2 cm','6,3 cm','15 cm'],[],'3 × 1,2 + 9 = 12,6. La fórmula baja, peso + 7, daría 8,2 [VERIFICAR].','Shukla y Ferrara, vía SIBEN'),
 Q('La punta queda entre T11 y T12. ¿Cómo se clasifica?',['Intermedia, frente a las ramas viscerales y renales, no recomendada','Alta, entre T6 y T9','Baja, entre L3 y L4','En el ventrículo'],[],'Entre T10 y L2 la punta queda frente a tronco celíaco, mesentérica y renales [VERIFICAR límites].','SIBEN, INS'),
 Q('¿Qué se hace?',['Avisar y reposicionar con técnica estéril hasta una posición aceptada, con nueva radiografía, o recolocar uno nuevo','Dejarlo y empezar a usarlo','Avanzarlo hasta T8 sin control','Usarlo solo para medir presión'],[1,2],'La zona intermedia no se acepta, y se corrige con control radiográfico [VERIFICAR protocolo local].','SIBEN, CDC')]},
{id:'2.4',lv:1,t:'PICC con la punta en la aurícula',ctx:'Prematuro de 27 semanas, 900 g. PICC por la basílica derecha. La longitud se midió hasta el tercer espacio intercostal derecho.',img:{k:'rx',c:'picc',tip:7,cap:'Radiografía de control'},rows:[['Peso','900 g'],['Catéter','PICC 1,9 Fr, basílica derecha']],q:[
 Q('Para el miembro superior, ¿hasta dónde se mide en superficie?',['Hasta el tercer espacio intercostal derecho, siguiendo el trayecto venoso','Hasta el ombligo','Hasta el codo contrario','Hasta el lóbulo de la oreja'],[],'Se mide siguiendo la vena hasta la zona de la unión cavoauricular [VERIFICAR el punto].','SIBEN, INS'),
 Q('¿Qué muestra la imagen?',['Punta dentro de la aurícula derecha, demasiado profunda','Punta bien ubicada en la cava superior','Punta en la yugular','Punta en la cava inferior'],[],'La punta se proyecta dentro de la silueta cardíaca: más riesgo de arritmia y de derrame pericárdico.','INS, SIBEN'),
 Q('¿Qué se hace?',['Retirarlo unos centímetros con técnica estéril hasta la cava superior y confirmar con imagen antes de usarlo','Dejarlo así porque funciona','Avanzarlo para que quede firme','Usarlo solo para soluciones isotónicas'],[1,2],'Un PICC con la punta en la aurícula se reposiciona y se verifica antes de infundir.','INS, SIBEN')]},
{id:'2.5',lv:1,t:'Midline con la punta en la axila',ctx:'Prematuro de 32 semanas, 1500 g, día 5. Midline de 1,9 Fr por la basílica derecha, medido hasta el pliegue axilar.',img:{k:'rx',c:'mid',cap:'Radiografía centrada en el hombro'},rows:[['Peso','1500 g'],['Catéter','Midline 1,9 Fr']],q:[
 Q('¿Dónde está la punta?',['En la vena axilar, fuera del tórax','En la aurícula derecha','En la cava inferior','En la arteria subclavia'],[],'La punta queda a la altura de la axila [VERIFICAR].','INS, SIBEN'),
 Q('¿Es una posición correcta para un midline?',['Sí, la punta periférica es la esperada, y solo se usa con soluciones compatibles con vía periférica','No, siempre debe llegar a la cava','No, debe quedar en la mano','Sí, y por eso admite nutrición parenteral hiperosmolar'],[],'Un midline no termina en una vena central.','INS'),
 Q('¿Qué se hace?',['Fijarlo, registrar la longitud externa, rotularlo como periférico y limitar las infusiones','Habilitarlo para nutrición parenteral con dextrosa al 15%','Avanzarlo hasta la aurícula','Retirarlo por no ser un acceso central'],[1,2],'Se registra la longitud externa para detectar migraciones y se aclara qué puede infundirse.','INS, SIBEN')]},
/* ---- Nivel 3 ---- */

   const cd=CARDS.find(x=>x.k===k);
   const dis=(k==='segunda'&&(R.hint||!img||img.k==='tags'))||(k==='pausa'&&R.freeze>0)||(k==='consulta'&&R.hid.length>0)||(k==='escudo'&&S.shield);
   return '<button class="cbtn" data-c="'+k+'"'+(dis?' disabled':'')+'><b>'+cd.n+'</b><small>'+cd.d+'</small></button>';
  }).join('')+'</div>';
 }
 put(h,sc===true);
 on('[data-i]',b=>b.onclick=()=>answer(+b.dataset.i));
 on('[data-t]',b=>b.onclick=()=>{R.tk=+b.dataset.t;drawRound(false)});
 on('[data-c]',b=>b.onclick=()=>useCard(b.dataset.c));
 if($('ps'))$('ps').onclick=obsPause;
 if($('nx'))$('nx').onclick=nextQ;
 sync();
}
function answer(i){
 if(!R||R.ans!==null||R.closing)return;
 const q=R.c.q[R.qi],h=S.half?.5:1,pts=[10,20,30][R.qi]*h;
 R.ans=i;
 if(i===0){R.pts+=pts;S.score+=pts;S.lvBase+=pts;S.lvScore+=pts;R.head='Correcto, suman '+pts+' puntos.'}
 else{
  R.err++;
  const crit=q.c.includes(i);
  S.review.push({lv:S.lv,ctx:R.c.id+' '+R.c.t,q:q.q,got:q.o[i],ok:q.o[0],why:q.w,src:q.s,crit});
  if(crit){if(S.shield){S.shield=false;R.head='Error crítico. El escudo evitó perder una vida.'}else{S.lives--;R.head='Error crítico, pierden una vida.'}}
  else R.head='Respuesta incorrecta, no suman puntos.';
 }
 save();drawRound(false);
}
function nextQ(){
 if(S.lives<=0){stop();R=null;rescue();return}
 R.qi++;
 if(R.qi>=3){closeRound();return}
 R.ans=null;R.hid=[];R.perm=shuffle([0,1,2,3]);R.msg=null;R.last=Date.now();
 drawRound(true);
}
function useCard(k){
 const idx=S.cards.indexOf(k);if(idx<0||R.ans!==null)return;
 if(k==='segunda'){R.hint=true;R.left+=30}
 else if(k==='pausa'){R.freeze=60}
 else if(k==='consulta'){R.hid=shuffle([1,2,3]).slice(0,2)}
 else if(k==='escudo'){S.shield=true;R.msg=['ok','Escudo activo: absorbe el próximo error crítico.']}
 S.cards.splice(idx,1);save();drawRound(false);
}
function obsPause(){
 const c=R.c,h=S.half?.5:1;
 if(c.fault&&!R.pOK){R.pOK=true;S.score+=10*h;S.lvScore+=10*h;R.msg=['ok','Pausa justificada, suman '+(10*h)+' puntos. '+c.fault]}
 else{R.left=Math.max(1,R.left-30);R.msg=['warn',(c.fault&&R.pOK?'Esa falla ya se había detectado.':'No había una falla real en esta ronda.')+' Se descuentan 30 segundos.']}
 save();drawRound(false);
}

/* ---------- Cierre de ronda y nivel ---------- */
function closeRound(){
 R.closing=true;stop();
 R.speed=R.err===0&&!R.timed&&R.left>R.tot/2;
 drawClose();
}
function drawClose(){
 const c=R.c,ok4=R.sbar.every(Boolean),names=['Situación','Antecedentes','Valoración','Recomendación'];
 let h='<h2>Cierre de la ronda '+c.id+'</h2>';
 if(R.timed)h+='<div class="fb warn"><strong>Se acabó el tiempo</strong>La ronda se cierra con lo que estaba marcado.</div>';
 h+='<div class="card"><table class="t"><tr><td>Puntos de las preguntas</td><td><b>'+R.pts+'</b></td></tr><tr><td>Errores</td><td>'+R.err+'</td></tr>'
 +'<tr><td>Bonus de rapidez</td><td>'+(R.speed?'+10':'No suma ('+(R.err?'hubo errores':'pasó la mitad del tiempo')+')')+'</td></tr></table></div>';
 h+='<h3>SBAR de quien comunica</h3><p class="muted">Tocá cada parte que el mensaje cubrió. Con las cuatro, suma 10 puntos.'+(c.sbar?' En este evento es obligatorio.':'')+'</p><div class="chips">'
 +names.map((n,i)=>'<button class="chip" data-s="'+i+'" aria-pressed="'+(R.sbar[i]?'true':'false')+'">'+n+'</button>').join('')+'</div>';
 if(R.err===0&&!R.timed&&S.lv>=3&&S.lives<5)h+='<div class="fb ok"><strong>Ronda sin errores</strong>Recuperan una vida.</div>';
 h+='<button class="btn" id="cont"'+(c.sbar&&!ok4?' disabled':'')+'>Continuar</button>';
 wait('Cierre de la ronda '+c.id+'. El coordinador suma los puntos.');
 put(hudHTML().replace(/id="tm"/,'')+h);
 on('[data-s]',b=>b.onclick=()=>{R.sbar[+b.dataset.s]=R.sbar[+b.dataset.s]?0:1;drawClose();});
 $('cont').onclick=finishRound;
}
function finishRound(){
 const h=S.half?.5:1;let add=0;
 if(R.speed)add+=10;
 if(R.sbar.every(Boolean))add+=10;
 add*=h;S.score+=add;S.lvScore+=add;
 if(R.err===0&&!R.timed&&S.lv>=3&&S.lives<5)S.lives++;
 S.ri++;R=null;save();
 if(S.ri>=S.plan[S.lv].length)levelEnd();else startRound();
}
function levelEnd(){
 const k=S.lv,n=S.plan[k].length,mx=n*60*(S.half?.5:1),min=Math.ceil(.6*mx),pass=S.lvBase>=min;
 let coop=true;
 wait('Nivel '+(k+1)+(pass?' superado.':' sin superar.'));
 const draw=()=>{
  put('<h2>Nivel '+(k+1)+' '+(pass?'superado':'sin superar')+'</h2>'
  +'<div class="card"><table class="t"><tr><td>Puntos de las preguntas</td><td><b>'+S.lvBase+'</b> de '+mx+'</td></tr><tr><td>Mínimo para avanzar</td><td>'+min+'</td></tr><tr><td>Puntaje total</td><td>'+S.score+'</td></tr></table></div>'
  +(pass?'<div class="badge">'+badgeSVG(k+1,true)+'<div><b>Insignia: '+LV[k].b+'</b>'+(k<4?'<div class="muted">Tarjeta de ayuda: '+CARDS[k].n+'</div>':'')+'</div></div>'
  +'<p>Cooperación: si todas las personas ocuparon algún rol, el equipo suma 50 puntos.</p><div class="chips"><button class="chip" id="cp" aria-pressed="'+coop+'">Todas participaron</button></div>'
  :'<div class="fb warn"><strong>Hace falta repetir el nivel</strong>No se llegó al 60% del puntaje de las preguntas. Se repite el nivel y se conservan las vidas.</div>')
  +'<button class="btn" id="nx">'+(pass?(k<4?'Siguiente nivel':'Ir al debriefing'):'Repetir el nivel')+'</button>');
  if($('cp'))$('cp').onclick=()=>{coop=!coop;draw()};
  $('nx').onclick=()=>{
   if(pass){
    if(coop)S.score+=50;
    S.badges.push(LV[k].b);if(k<4)S.cards.push(CARDS[k].k);
    S.half=false;S.lv++;S.ri=0;S.lvBase=0;S.lvScore=0;
    if(S.lv>=5){S.done=true;save();debrief();return}
    save();levelIntro();
   }else{S.score-=S.lvScore;S.lvScore=0;S.lvBase=0;S.ri=0;save();levelIntro()}
  };
 };
 draw();
}
function rescue(){
 stop();wait('Reanimación del equipo.');
 put('<h2>Reanimación del equipo</h2><p>Se terminaron las vidas. Equivocarse en un entrenamiento tiene remedio: se repite el nivel '+(S.lv+1)+' con 3 vidas y la mitad del puntaje, y lo importante es entender qué pasó.</p><button class="btn" id="rs">Repetir el nivel</button>');
 $('rs').onclick=()=>{S.lives=3;S.half=true;S.score-=S.lvScore;S.lvScore=0;S.lvBase=0;S.ri=0;S.shield=false;save();levelIntro()};
}

/* ---------- Debriefing y certificado ---------- */
function debrief(){
 stop();wait('Debriefing del equipo.');
 const by={};S.review.forEach(r=>{(by[r.lv]=by[r.lv]||[]).push(r)});
 const rv=Object.keys(by).map(k=>'<details class="rv"><summary>Nivel '+(+k+1)+'. '+LV[k].n+' ('+by[k].length+')</summary>'+by[k].map(r=>'<div class="rvi'+(r.crit?' crit':'')+'"><div class="muted">'+esc(r.ctx)+(r.crit?', error crítico':'')+'</div><div><b>'+esc(r.q)+'</b></div><div>Marcaron: '+esc(r.got)+'</div><div class="rok">Correcta: '+esc(r.ok)+'</div><div class="muted">'+ver(r.why)+' Fuente: '+ver(r.src)+'</div></div>').join('')+'</details>').join('');
 put('<h2>Debriefing</h2><p>El puntaje final es <b>'+S.score+'</b>. Se habla de decisiones y de sistemas, no de personas.</p>'
 +'<details class="rv" open><summary>1. Reacciones</summary><p>¿Cómo se sintió el grupo? ¿Qué momento les costó más y por qué?</p></details>'
 +'<details class="rv" open><summary>2. Análisis</summary><p>Elijan dos errores y pregúntense qué pasó en la decisión, no quién se equivocó.</p>'+(rv||'<p class="muted">No hubo errores registrados.</p>')+'</details>'
 +'<details class="rv" open><summary>3. Aplicación</summary><p>Cada persona nombra una práctica del bundle que va a revisar en su unidad durante esta semana.</p></details>'
 +'<button class="btn" id="ct">Ver el certificado</button><button class="btn sec" id="hm">Salir al inicio</button>');
 $('ct').onclick=cert;$('hm').onclick=home;
}
function cert(){
 wait('Fin de la partida.');
 const who=S.names.length?S.names.join(', '):'Equipo';
 put('<div class="cert"><h2>Certificado de participación</h2><p>Capacitación cooperativa en catéteres neonatales</p><p><b>'+esc(who)+'</b></p><div class="big">'+S.score+'</div><p class="muted">puntos del equipo</p>'
 +'<div style="text-align:left">'+LV.map((l,i)=>'<div class="badge">'+badgeSVG(i+1,S.badges.includes(l.b))+'<div><b>'+l.b+'</b><div class="muted">'+(S.badges.includes(l.b)?'Obtenida':'No obtenida')+', nivel '+(i+1)+'</div></div></div>').join('')+'</div>'
 +'<p class="muted">'+new Date().toLocaleDateString('es-AR')+'. Certifica la participación en un entrenamiento, no una acreditación de competencias.</p></div>'
 +'<button class="btn noprint" id="pr">Imprimir o guardar</button><button class="btn sec noprint" id="nw">Nueva partida</button><button class="btn sec noprint" id="hm">Salir al inicio</button>');
 $('pr').onclick=()=>{try{window.print()}catch(e){}};
 $('nw').onclick=()=>{wipe();S=null;setup()};$('hm').onclick=home;
}

/* ---------- Modo espejo: ver el caso en mi celular ---------- */
function viewerPick(){
 stop();MODE=null;clearInterval(FT);FT=null;
 let last='';try{last=localStorage.getItem('cet-follow')||''}catch(e){}
 put('<h2>Ver el caso en mi celular</h2>'
 +'<div class="card"><h3>Seguir la partida en vivo</h3><p class="muted">Quien coordina responde. Vos ves el mismo caso y las imágenes en tu pantalla. Pedile el código de la sala.</p>'
 +'<input type="text" id="cd" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="Código, por ejemplo K7M2" value="'+esc(last.toUpperCase())+'" aria-label="Código de la sala"><div id="fm"></div>'
 +'<button class="btn" id="fj">Unirme a la partida</button></div>'
 +'<p>O elegí a mano el nivel y la ronda.</p>'
 +LV.map((l,k)=>'<h3>Nivel '+(k+1)+'. '+l.n+'</h3>'+CASES.filter(c=>c.lv===k).map(c=>'<button class="btn sec sm" data-id="'+c.id+'">'+c.id+' '+esc(c.t)+'</button>').join('')).join('')
 +'<button class="btn" id="bk">Volver</button>');
 on('[data-id]',b=>b.onclick=()=>viewerShow(b.dataset.id));
 $('fj').onclick=followStart;$('bk').onclick=home;
}
async function followStart(){
 const code=($('cd').value||'').toLowerCase().replace(/[^a-z0-9]/g,''),fm=$('fm');
 if(code.length<4){fm.innerHTML='<div class="fb warn">Escribí el código de 4 caracteres.</div>';return}
 if(!ROOM){fm.innerHTML='<div class="fb warn">La sala en vivo no está disponible en este momento. Podés elegir el caso a mano más abajo.</div>';return}
 fm.innerHTML='<p class="muted">Conectando...</p>';
 const r=await joinCode(code);
 if(!r){fm.innerHTML='<div class="fb warn">No se pudo entrar a la sala. Revisá el código e intentá de nuevo.</div>';return}
 try{localStorage.setItem('cet-follow',code)}catch(e){}
 MODE='follow';FOLLOW=code;lastPres=null;FP=null;
 if(UNS)UNS();
 UNS=r.onPeers(()=>drawFollow());
 clearInterval(FT);FT=setInterval(ftick,500);
 drawFollow();
}
function leaveFollow(){
 clearInterval(FT);FT=null;if(UNS){UNS();UNS=null}
 MODE=null;FP=null;lastPres=null;
 const r=ROOMC;ROOMC=null;if(r){try{r.leave()}catch(e){}}
 viewerPick();
}
function hostPeer(){let b=null;if(ROOMC)ROOMC.peers().forEach(p=>{if(p.presence&&p.presence.host===1&&!p.isMe&&(!b||p.updatedAt>b.updatedAt))b=p});return b}
function ftick(){
 if(MODE!=='follow'||!FP)return;
 const s=FP.presence;if(s.scr!=='round')return;
 const el=(Date.now()-FP.updatedAt)/1000;let t,pa='';
 if(s.a>=0)t=s.left;else if(s.fr>0){const f=s.fr-el;if(f>0){t=f;pa='Pausa '}else t=s.left-(el-s.fr)}else t=s.left-el;
 const e=$('ftm');if(e){e.textContent=pa+mmss(t);e.classList.toggle('low',!pa&&t<20)}
}
function drawFollow(){
 if(MODE!=='follow')return;
 const hp=hostPeer(),bye='<button class="btn sec" id="fx">Salir de la sala</button>';
 if(!hp){FP=null;lastPres=null;put('<h2>Sala '+esc(FOLLOW.toUpperCase())+'</h2><p>Esperando al coordinador. Cuando empiece la partida vas a ver el caso acá.</p>'+bye);$('fx').onclick=leaveFollow;return}
 const s=hp.presence;
 if(s===lastPres)return;
 lastPres=s;FP=hp;
 const c=CASES.find(x=>x.id===s.id);
 if(s.scr!=='round'||!c||!(s.qi>=0&&s.qi<3)){
  put('<h2>Sala '+esc(FOLLOW.toUpperCase())+'</h2><div class="card"><h3>'+esc(String(s.m||'El coordinador está preparando la partida.'))+'</h3><div class="hearts" aria-label="'+(+s.lives||0)+' vidas">'+heartsN(+s.lives||0)+'</div><p class="muted"><b>'+(+s.score||0)+'</b> puntos del equipo</p></div>'+bye);
  $('fx').onclick=leaveFollow;return;
 }
 const q=c.q[s.qi],tom=c.tomas?c.tomas[s.tk]:null,img=tom?tom.img:c.img,rows=tom?tom.rows:c.rows,done=s.a>=0;
 const perm=Array.isArray(s.perm)&&s.perm.length===4?s.perm:[0,1,2,3],hid=Array.isArray(s.hid)?s.hid:[];
 let h='<div class="hud"><div><b>Nivel '+((+s.lv||0)+1)+'</b><div class="muted">Ronda '+((+s.ri||0)+1)+' de '+(+s.n||1)+'</div></div><div class="tm" id="ftm">'+mmss(s.left)+'</div><div style="text-align:right"><div class="hearts" aria-label="'+(+s.lives||0)+' vidas">'+heartsN(+s.lives||0)+'</div><div class="muted"><b>'+(+s.score||0)+'</b> puntos</div></div></div>'
 +'<div class="fb ok" style="margin-top:10px"><strong>Estás viendo la partida en vivo</strong>Solo quien coordina responde. Sala '+esc(FOLLOW.toUpperCase())+'.</div>'
 +'<h2>'+c.id+' '+esc(c.t)+'</h2>'+rolesHTML(Array.isArray(s.nm)?s.nm.map(String):[],+s.rc||0)+'<p>'+esc(c.ctx)+'</p>'+imgHTML(img,!!s.hint);
 if(c.tomas)h+='<div class="chips">'+c.tomas.map((t,i)=>'<span class="chip" aria-pressed="'+(i===s.tk)+'">Toma '+(i+1)+', '+t.h+'</span>').join('')+'</div>';
 h+=tableHTML(rows);
 if(c.obs)h+='<div class="card obs"><h3>Checklist de quien observa</h3><ul>'+c.obs.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ul></div>';
 if(s.msg)h+='<div class="fb warn">'+esc(String(s.msg))+'</div>';
 h+='<div class="card"><div class="qn">Pregunta '+(s.qi+1)+' de 3, '+QL[s.qi]+'</div><h3>'+esc(q.q)+'</h3>';
 perm.forEach(i=>{
  let cl='opt';if(done){if(i===0)cl+=' ok';else if(i===s.a)cl+=' bad'}
  h+='<button class="'+cl+'" type="button" disabled'+(hid.includes(i)?' hidden':'')+'>'+esc(q.o[i]||'')+'</button>';
 });
 h+='</div>';
 if(done)h+='<div class="fb '+(s.a===0?'ok':'bad')+'"><strong>'+esc(String(s.head||''))+'</strong>'+(s.a===0?'':'Respuesta correcta: <b>'+esc(q.o[0])+'</b>.<br>')+ver(q.w)+'<div class="src">Fuente: '+ver(q.s)+'</div></div>';
 h+=bye;
 put(h,false);$('fx').onclick=leaveFollow;ftick();
}
function viewerShow(id){
 const c=CASES.find(x=>x.id===id);
 V={c,qi:0,tk:0,rev:false,mine:null,perm:shuffle([0,1,2,3])};
 drawV(true);
}
function drawV(sc){
 const c=V.c,q=c.q[V.qi],tom=c.tomas?c.tomas[V.tk]:null,img=tom?tom.img:c.img,rows=tom?tom.rows:c.rows,ix=CASES.indexOf(c);
 let h='<div class="row2"><button class="btn sec sm" id="vp">Elegir otro caso</button><button class="btn sec sm" id="vh">Inicio</button></div>'
 +'<h2>Nivel '+(c.lv+1)+', '+c.id+' '+esc(c.t)+'</h2><p>'+esc(c.ctx)+'</p>'+imgHTML(img,V.rev);
 if(c.tomas)h+='<div class="chips">'+c.tomas.map((t,i)=>'<button class="chip" data-t="'+i+'" aria-pressed="'+(i===V.tk)+'">Toma '+(i+1)+', '+t.h+'</button>').join('')+'</div>';
 h+=tableHTML(rows);
 if(c.obs)h+='<div class="card obs"><h3>Checklist de quien observa</h3><ul>'+c.obs.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ul></div>';
 h+='<div class="card"><div class="qn">Pregunta '+(V.qi+1)+' de 3, '+QL[V.qi]+'</div><h3>'+esc(q.q)+'</h3>';
 V.perm.forEach(i=>{
  let cl='opt';if(V.rev){if(i===0)cl+=' ok';else if(i===V.mine)cl+=' bad'}else if(i===V.mine)cl+=' mine';
  h+='<button class="'+cl+'" type="button" data-i="'+i+'"'+(V.rev?' disabled':'')+'>'+esc(q.o[i])+'</button>';
 });
 h+='<p class="muted">Tocá una opción para marcarla en tu pantalla y discutila con el equipo. La respuesta la dice en voz alta quien comunica.</p>';
 if(V.rev)h+='<div class="fb ok"><strong>Respuesta correcta</strong>'+ver(q.w)+'<div class="src">Fuente: '+ver(q.s)+'</div></div>';
 else h+='<button class="btn sec sm" id="vr">Ver la respuesta correcta</button>';
 h+='<div class="row2"><button class="btn sec sm" id="qp"'+(V.qi===0?' disabled':'')+'>Pregunta anterior</button><button class="btn sec sm" id="qn"'+(V.qi===2?' disabled':'')+'>Pregunta siguiente</button></div></div>'
 +'<div class="row2"><button class="btn sm" id="cp"'+(ix===0?' disabled':'')+'>Caso anterior</button><button class="btn sm" id="cn"'+(ix===CASES.length-1?' disabled':'')+'>Caso siguiente</button></div>';
 put(h,sc===true);
 on('[data-i]',b=>b.onclick=()=>{if(!V.rev){V.mine=+b.dataset.i;drawV(false)}});
 on('[data-t]',b=>b.onclick=()=>{V.tk=+b.dataset.t;drawV(false)});
 $('vp').onclick=viewerPick;$('vh').onclick=home;
 if($('vr'))$('vr').onclick=()=>{V.rev=true;drawV(false)};
 const go=d=>{V.qi+=d;V.rev=false;V.mine=null;V.perm=shuffle([0,1,2,3]);drawV(true)};
 $('qp').onclick=()=>go(-1);$('qn').onclick=()=>go(1);
 $('cp').onclick=()=>viewerShow(CASES[ix-1].id);$('cn').onclick=()=>viewerShow(CASES[ix+1].id);
}
window.addEventListener('pagehide',stop);
home();
</script>
</body>
</html>
